spring.application.name=astro-natal-ai-backend
spring.mvc.problemdetails.enabled=true

# Datasource: todas las variables vienen del entorno (.env / Infisical / IntelliJ)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
spring.flyway.enabled=true

server.port=${BACKEND_PORT}

# JWT: el secreto es obligatorio por entorno (JWT_SECRET, mínimo 32 bytes).
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL}
app.jwt.issuer=${JWT_ISSUER}

# Servicios externos
app.geocoding.url=${GEOCODING_URL}
app.astro-engine.url=${ASTRO_ENGINE_URL}
