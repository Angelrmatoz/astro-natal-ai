spring.application.name=astro-natal-ai-backend
spring.mvc.problemdetails.enabled=true

# Perfil obligatorio: dev o prod (SPRING_PROFILES_ACTIVE / Active profiles).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
spring.flyway.enabled=true

server.port=8080
