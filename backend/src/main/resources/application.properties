spring.application.name=astro-natal-ai-backend
spring.mvc.problemdetails.enabled=true

# Datasource (PostgreSQL en Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:astro_natal}
spring.datasource.username=${POSTGRES_USER:astro}
spring.datasource.password=${POSTGRES_PASSWORD:astro_dev_password}

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
spring.flyway.enabled=true

server.port=${BACKEND_PORT:8080}

# JWT (dev-only; en produccion usar JWT_SECRET de al menos 32 bytes)
app.jwt.secret=${JWT_SECRET:dev-only-change-me-this-secret-is-32-bytes-minimum}
app.jwt.ttl=${JWT_TTL:PT24H}
app.jwt.issuer=${JWT_ISSUER:astro-natal-ai}

# Servicios externos
app.geocoding.url=${GEOCODING_URL:https://geocoding-api.open-meteo.com}
app.astro-engine.url=${ASTRO_ENGINE_URL:http://localhost:3001}
