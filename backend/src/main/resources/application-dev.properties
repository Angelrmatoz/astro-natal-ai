# Perfil dev: solo overrides. Todo lo comun vive en application.properties.
# Los secretos siguen viniendo del entorno (.env cargado en IntelliJ o Infisical).

# Motor local y frontend de Vite por defecto.
app.astro-engine.url=${ASTRO_ENGINE_URL:http://localhost:3001}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# En desarrollo interesa ver el detalle de cada indicador de salud.
management.endpoint.health.show-details=always
