spring.application.name=astro-natal-ai-backend
spring.mvc.problemdetails.enabled=true

# Configuración común. Los perfiles dev/prod solo agregan overrides.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
spring.flyway.enabled=true

server.port=8080

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:PT24H}
app.jwt.issuer=${JWT_ISSUER:astro-natal-ai}
app.geocoding.url=${GEOCODING_URL:https://geocoding-api.open-meteo.com}
app.astro-engine.url=${ASTRO_ENGINE_URL}
