# Perfil prod: sin defaults; todo debe venir del entorno o de Infisical.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:PT24H}
app.jwt.issuer=${JWT_ISSUER:astro-natal-ai}

app.geocoding.url=${GEOCODING_URL}
app.astro-engine.url=${ASTRO_ENGINE_URL}
