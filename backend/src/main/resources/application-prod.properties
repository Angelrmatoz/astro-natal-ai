# Perfil prod: solo overrides. Todo lo comun vive en application.properties.
# Estos valores son obligatorios: sin ellos la app no arranca.

# Plataformas como Render o Railway inyectan PORT.
server.port=${PORT:8080}

# URL interna del motor y origen real del frontend.
app.astro-engine.url=${ASTRO_ENGINE_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Cross-site: Vercel y el backend viven en dominios distintos. Solo sobre HTTPS.
app.auth.cookie-secure=true
app.auth.cookie-same-site=None

# No exponer detalles de salud fuera del despliegue.
management.endpoint.health.show-details=never
