# Perfil dev: defaults locales; los secretos siguen viniendo del entorno.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:astro_natal}
spring.datasource.username=${POSTGRES_USER:astro}
spring.datasource.password=${POSTGRES_PASSWORD:astro_dev_password}

app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=${JWT_TTL:PT24H}
app.jwt.issuer=${JWT_ISSUER:astro-natal-ai}

app.geocoding.url=${GEOCODING_URL:https://geocoding-api.open-meteo.com}
app.astro-engine.url=${ASTRO_ENGINE_URL:http://localhost:3001}
