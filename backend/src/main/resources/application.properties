spring.application.name=astro-natal-ai-backend
spring.mvc.problemdetails.enabled=true

# Configuracion comun a todos los entornos.
# Los perfiles dev/prod solo definen lo que cambia entre entornos.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
spring.flyway.enabled=true

server.port=8080

management.endpoint.health.probes.enabled=true

# JWT: el secreto es obligatorio y no tiene default.
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:PT24H}
app.jwt.issuer=${JWT_ISSUER:astro-natal-ai}

# Servicios externos que no cambian entre entornos.
app.geocoding.url=${GEOCODING_URL:https://geocoding-api.open-meteo.com}

# IA
app.ai.api-key=${GOOGLE_AI_API_KEY}
app.ai.model=${GOOGLE_AI_MODEL:gemma-4-31b-it}
app.ai.fallback-model=${GOOGLE_AI_FALLBACK_MODEL:gemma-4-26b-a4b-it}
app.ai.timeout-seconds=${GOOGLE_AI_TIMEOUT_SECONDS:300}
